<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> NSRIT Alumni Portal Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#dcd0d0;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            width:350px;
            background:#fff;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
            color:#fa0303;
        }

        .input-box{
            margin-bottom:15px;
        }

        .input-box label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
        }

        .input-box input{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        .btn{
            width:100%;
            padding:10px;
            background:#ff0000;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        .btn:hover{
            background:#fd0000;
        }

        .links{
            text-align:center;
            margin-top:15px;
        }

        .links a{
            text-decoration:none;
            color:#ff0000;
        }

        .links a:hover{
            text-decoration:underline;
        }
    </style>
</head>

<body>

    <div class="watermark">
    <img src="images/nsrit-logo.png" alt="NSRIT Logo">
</div>

<div class="login-box">

    <h2>NSRIT Alumni Portal Login</h2>

    <form action="dashboard.html">

        <div class="input-box">
            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="input-box">
            <label>Password</label>
            <input type="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn">Login</button>

        <div class="links">
            <p><a href="#">Forgot Password?</a></p>
            <br>
            <p>New User? <a href="register.html">Register Here</a></p>
        </div>

    </form>

</div>

</body>
</html>
